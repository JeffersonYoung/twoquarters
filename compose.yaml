services:
  portfolio:
    build: .
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the exact public HTTPS origin in .env}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - portfolio_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
volumes:
  portfolio_data:
